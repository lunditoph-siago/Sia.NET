<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sia.NET Examples</title>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap"></script>
    <script src="threads#[.{fingerprint}].js"></script>
</head>
<body>
    <div id="app">
        <aside id="sidebar" aria-label="Notebook explorer">
            <div class="sidebar-heading">
                <span>EXPLORER</span>
                <span id="sidebar-actions" class="sidebar-actions"></span>
            </div>
            <section class="library-folder">
                <button class="library-folder-toggle" type="button"
                        data-library-toggle="built-in-notebooks" aria-expanded="true">
                    <svg class="folder-caret" viewBox="0 0 24 24" width="12" height="12">
                        <polyline points="6 9 12 15 18 9" />
                    </svg>
                    <span>Built-in</span>
                </button>
                <div id="built-in-notebooks" class="library-items"></div>
            </section>
            <section class="library-folder">
                <button class="library-folder-toggle" type="button"
                        data-library-toggle="user-notebooks" aria-expanded="true">
                    <svg class="folder-caret" viewBox="0 0 24 24" width="12" height="12">
                        <polyline points="6 9 12 15 18 9" />
                    </svg>
                    <span>User notebooks</span>
                </button>
                <div id="user-notebooks" class="library-items"></div>
            </section>
        </aside>
        <main id="content">
            <div id="content-header">
                <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <line class="bar bar-top" x1="3" y1="6" x2="21" y2="6" />
                        <line class="bar bar-mid" x1="3" y1="12" x2="21" y2="12" />
                        <line class="bar bar-bot" x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>
                <div id="notebook-actions"></div>
                <div id="header-packages" class="header-packages">
                    <button id="packages-toggle" class="packages-toggle" aria-label="Packages">
                        Packages<span id="packages-badge" class="packages-badge"></span>
                        <svg class="packages-caret" viewBox="0 0 24 24" width="14" height="14">
                            <polyline points="6 9 12 15 18 9" />
                        </svg>
                    </button>
                    <div id="packages-popover" class="packages-popover"></div>
                </div>
            </div>
            <datalist id="framework-assemblies"></datalist>
            <div id="notebook"><span class="placeholder">← Choose a notebook to open it</span></div>
        </main>
    </div>
</body>
</html>
