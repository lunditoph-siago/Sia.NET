<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Sia.NET</title>
    <script>
        document.documentElement.classList.add('resolving');
        document.title = 'Loading Sia.NET Examples…';
    </script>
    <style>
        /* Standalone pending state: the application stylesheet is unreachable until root discovery. */
        .boot-overlay {
            position: fixed;
            z-index: 85;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            padding: 1.5rem;
            box-sizing: border-box;
            background: var(--color-bg, light-dark(#eff1f5, #1e1e2e));
            color: var(--color-fg, light-dark(#4c4f69, #cdd6f4));
            font: normal 1rem/normal system-ui, monospace;

            * {
                box-sizing: border-box;
            }

            .boot-spinner {
                width: 2.2rem;
                height: 2.2rem;
                border: 2px solid var(--border-subtle, rgb(127 127 127 / 0.3));
                border-top-color: var(--color-accent, light-dark(#8839ef, #cba6f7));
                border-radius: 50%;
                animation: boot-spin 0.9s linear infinite;
            }

            .boot-message {
                margin: 0;
                opacity: 0.7;
                font-size: 0.85rem;
                text-align: center;
            }

            .boot-progress {
                width: min(18rem, 70vw);
                height: 4px;
                overflow: hidden;
                border-radius: 999px;
                background: var(--surface-hover, rgb(127 127 127 / 0.15));
            }

            .boot-progress-fill {
                width: 30%;
                height: 100%;
                border-radius: inherit;
                background: var(--color-accent, light-dark(#8839ef, #cba6f7));
                animation: boot-pending 1.5s ease-in-out infinite alternate;
            }

            .boot-progress-label {
                margin: 0;
                opacity: 0.55;
                font-size: 0.7rem;
            }

            @media (prefers-reduced-motion: reduce) {
                .boot-spinner,
                .boot-progress-fill {
                    animation: none;
                }
            }
        }

        @keyframes boot-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes boot-pending {
            to {
                transform: translateX(235%);
            }
        }

        :root {
            color-scheme: light dark;

            &.resolving {
                .not-found {
                    display: none;
                }
            }

            &:not(.resolving) {
                .boot-overlay {
                    display: none;
                }
            }
        }

        body {
            box-sizing: border-box;
            display: grid;
            align-content: center;
            min-height: 100svh;
            margin: 0;
            padding: 2rem clamp(1.5rem, 8vw, 6rem);
            background: var(--color-bg, light-dark(#eff1f5, #1e1e2e));
            color: var(--color-fg, light-dark(#4c4f69, #cdd6f4));
            font-family: system-ui, sans-serif;
        }

        .not-found {
            width: min(100%, 40rem);
            margin-inline: auto;

            .code {
                color: var(--color-accent, light-dark(#8839ef, #cba6f7));
                font: 600 0.85rem var(--font-mono, ui-monospace, monospace);
                letter-spacing: 0.12em;
            }

            h1 {
                margin: 0.75rem 0 1rem;
                font-size: clamp(2.5rem, 7vw, 4.8rem);
                font-weight: 620;
                line-height: 1.05;
                letter-spacing: -0.055em;
            }

            .message {
                max-width: 36ch;
                color: var(--color-subtle, light-dark(#7c7f93, #9399b2));
                line-height: 1.65;
            }

            a {
                display: inline-flex;
                align-items: center;
                gap: 0.75rem;
                min-height: 44px;
                box-sizing: border-box;
                margin-top: 1.25rem;
                padding: 0.65rem 1rem;
                border: 1px solid var(--border-control, rgb(127 127 127 / 0.4));
                border-radius: var(--radius-control, 4px);
                color: inherit;
                text-decoration: none;

                &:hover {
                    border-color: var(--color-accent, light-dark(#8839ef, #cba6f7));
                    background: var(--surface-hover, rgb(127 127 127 / 0.15));
                }

                &:focus-visible {
                    outline: 2px solid var(--color-accent, light-dark(#8839ef, #cba6f7));
                    outline-offset: 4px;
                }
            }
        }
    </style>
</head>
<body>
    <div id="boot-overlay" class="boot-overlay" role="status" aria-live="polite">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p class="boot-message">Loading Sia.NET Examples…</p>
        <div class="boot-progress" aria-hidden="true">
            <div class="boot-progress-fill"></div>
        </div>
        <p class="boot-progress-label">Preparing…</p>
        <button id="boot-reload" class="boot-reload" type="button" hidden>Reload page</button>
    </div>

    <main class="not-found">
        <p class="code">404</p>
        <h1>Page not found.</h1>
        <p class="message">This page is unavailable or the address has changed.</p>
        <a id="home" href="/">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m12 5-7 7 7 7M5 12h14" />
            </svg>
            Back to Home
        </a>
    </main>

    <script>
        (async () => {
            let redirecting = false;
            try {
                const entry = new URL(location.href);
                for (let home = new URL('./', entry); ; home = new URL('../', home)) {
                    try {
                        const response = await fetch(new URL('index.html', home));
                        if (response.ok && (await response.text()).includes('id="home-open-editor"')) {
                            document.getElementById('home').href = home.href;
                            const theme = document.createElement('link');
                            theme.rel = 'stylesheet';
                            theme.href = new URL('tokens.css', home).href;
                            document.head.append(theme);
                            if (entry.pathname.endsWith('/404.html')) {
                                const path = entry.searchParams.get('path');
                                const requested = path && new URL(path, entry);
                                if (requested && requested.origin === home.origin
                                    && requested.pathname.startsWith(home.pathname)) {
                                    history.replaceState(null, '', requested);
                                }
                            } else {
                                const path = entry.pathname.slice(home.pathname.length).replace(/^\/+|\/+$/g, '');
                                if (/^(editor|new)$|^notebooks\//.test(path)) {
                                    const target = new URL(home);
                                    target.searchParams.set('__path', entry.pathname + entry.search + entry.hash);
                                    location.replace(target);
                                    redirecting = true;
                                }
                            }
                            return;
                        }
                    } catch {
                    }
                    if (home.pathname === '/') {
                        return;
                    }
                }
            } finally {
                if (!redirecting) {
                    document.title = 'Page not found · Sia.NET';
                    document.documentElement.classList.remove('resolving');
                }
            }
        })();
    </script>
</body>
</html>
