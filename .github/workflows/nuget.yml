name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    env:
      BUILD_CONFIG: 'Release'
      SOLUTION: 'Sia.slnx'
      PACKAGE_OUTPUT_DIRECTORY: ${{github.workspace}}/output

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Restore dependencies
        run: dotnet restore $SOLUTION

      - name: Get version from tag
        run: | 
          VERSION=${{github.ref_name}}
          echo "VERSION=${VERSION:1}" >> $GITHUB_ENV

      - name: Build project
        run: dotnet build $SOLUTION --configuration $BUILD_CONFIG -p:Version=$VERSION --no-restore

      - name: Run tests
        run: dotnet test /p:Configuration=$BUILD_CONFIG --no-restore --no-build --verbosity normal

      - name: Pack project
        run: dotnet pack $SOLUTION --configuration $BUILD_CONFIG -p:PackageVersion=$VERSION --no-restore --no-build --output $PACKAGE_OUTPUT_DIRECTORY

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push ${PACKAGE_OUTPUT_DIRECTORY}/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source 'https://api.nuget.org/v3/index.json' \
            --skip-duplicate
          dotnet nuget add source \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.repository_owner }}" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text
          dotnet nuget push ${PACKAGE_OUTPUT_DIRECTORY}/*.nupkg \
            --api-key "$GITHUB_TOKEN" \
            --source github \
            --skip-duplicate
